# Device Data Simulator - Skip tests (it's a runner, not a testable service)
test:device-simulator:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  needs:
    - build:device-simulator
  script:
    - cd "Device Data Simulator"
    - echo "Skipping tests for simulator - it runs continuously and exits"
    - mvn test-compile

# Validate Python syntax (Websocket Service)
test:websocket-service:
  stage: test
  image: python:3.11-slim
  needs:
    - build:websocket-service
  script:
    - cd "Websocket and Support Service"
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m py_compile main.py gemini_client.py

# ===========================================
# DOCKER BUILD STAGE
# ===========================================

# Build Docker images (only on main/master branch)
.docker-build-template: &docker-build
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never

docker:auth-service:
  <<: *docker-build
  needs:
    - test:auth-service
  script:
    - docker build -t $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/auth-service:latest "./Auth Microservice"
    - docker push $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/auth-service:latest

docker:user-service:
  <<: *docker-build
  needs:
    - test:user-service
  script:
    - docker build -t $CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/user-service:latest "./User Management Microservice"
    - docker push $CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/user-service:latest

docker:device-service:
  <<: *docker-build
  needs:
    - test:device-service
  script:
    - docker build -t $CI_REGISTRY_IMAGE/device-service:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/device-service:latest "./Device Management Microservice"
    - docker push $CI_REGISTRY_IMAGE/device-service:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/device-service:latest

docker:monitoring-service:
  <<: *docker-build
  needs:
    - test:monitoring-service
  script:
    - docker build -t $CI_REGISTRY_IMAGE/monitoring-service:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/monitoring-service:latest "./Monitoring Microservice"
    - docker push $CI_REGISTRY_IMAGE/monitoring-service:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/monitoring-service:latest

docker:device-simulator:
  <<: *docker-build
  needs:
    - test:device-simulator
  script:
    - docker build -t $CI_REGISTRY_IMAGE/device-simulator:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/device-simulator:latest "./Device Data Simulator"
    - docker push $CI_REGISTRY_IMAGE/device-simulator:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/device-simulator:latest

docker:frontend:
  <<: *docker-build
  needs:
    - build:frontend
  script:
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/frontend:latest ./Frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest

docker:websocket-service:
  <<: *docker-build
  needs:
    - test:websocket-service
  script:
    - docker build -t $CI_REGISTRY_IMAGE/websocket-service:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/websocket-service:latest "./Websocket and Support Service"
    - docker push $CI_REGISTRY_IMAGE/websocket-service:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/websocket-service:latest

# ===========================================
# DEPLOY STAGE - AWS EC2
# ===========================================

# Deploy to AWS EC2
deploy:aws:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$AWS_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $AWS_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to AWS EC2..."
    - ssh $AWS_USER@$AWS_HOST "
        cd $AWS_APP_DIR &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker-compose pull &&
        docker-compose down &&
        docker-compose up -d &&
        docker image prune -f
      "
  environment:
    name: production
    url: http://$AWS_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
  needs:
    - docker:auth-service
    - docker:user-service
    - docker:device-service
    - docker:monitoring-service
    - docker:device-simulator
    - docker:frontend
    - docker:websocket-service
