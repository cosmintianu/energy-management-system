# GitLab CI/CD Pipeline for Energy Management System
# This pipeline builds, tests, and deploys all microservices to AWS
#
# Required GitLab CI/CD Variables (Settings > CI/CD > Variables):
# ---------------------------------------------------------------
# AWS_SSH_PRIVATE_KEY   - Your EC2 .pem key file contents (type: File)
# AWS_SSH_KNOWN_HOSTS   - Run: ssh-keyscan <EC2_IP> (type: Variable)
# AWS_HOST              - Your EC2 public IP or hostname
# AWS_USER              - SSH user (ec2-user for Amazon Linux, ubuntu for Ubuntu)
# AWS_APP_DIR           - App directory on EC2 (e.g., /home/ec2-user/app)

stages:
  - build
  - test
  - docker
  - deploy

# Global variables
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# Cache Maven dependencies across jobs
.maven-cache: &maven-cache
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/

# Cache Node.js dependencies
.node-cache: &node-cache
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - Frontend/node_modules/

# ===========================================
# BUILD STAGE
# ===========================================

# Build Auth Microservice
build:auth-service:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  script:
    - cd "Auth Microservice"
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - "Auth Microservice/target/"
    expire_in: 1 hour

# Build User Management Microservice
build:user-service:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  script:
    - cd "User Management Microservice"
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - "User Management Microservice/target/"
    expire_in: 1 hour

# Build Device Management Microservice
build:device-service:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  script:
    - cd "Device Management Microservice"
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - "Device Management Microservice/target/"
    expire_in: 1 hour

# Build Monitoring Microservice
build:monitoring-service:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  script:
    - cd "Monitoring Microservice"
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - "Monitoring Microservice/target/"
    expire_in: 1 hour

# Build Device Data Simulator
build:device-simulator:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  script:
    - cd "Device Data Simulator"
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - "Device Data Simulator/target/"
    expire_in: 1 hour

# Build Frontend
build:frontend:
  stage: build
  image: node:20-alpine
  <<: *node-cache
  script:
    - cd Frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - Frontend/dist/
    expire_in: 1 hour

# Check Python dependencies (Websocket Service)
build:websocket-service:
  stage: build
  image: python:3.11-slim
  script:
    - cd "Websocket and Support Service"
    - pip install --upgrade pip
    - pip install -r requirements.txt
  cache:
    key: python-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/

# ===========================================
# TEST STAGE
# ===========================================

# Test Auth Microservice
test:auth-service:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  services:
    - postgres:16
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DB_IP: postgres
    DB_PORT: 5432
    DB_DBNAME: test_db
    DB_USER: postgres
    DB_PASSWORD: postgres
  needs:
    - build:auth-service
  script:
    - cd "Auth Microservice"
    - mvn test
  artifacts:
    when: always
    reports:
      junit: "Auth Microservice/target/surefire-reports/*.xml"
    paths:
      - "Auth Microservice/target/surefire-reports/"
    expire_in: 1 week

# Test User Management Microservice
test:user-service:
