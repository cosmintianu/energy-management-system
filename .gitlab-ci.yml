    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DB_IP: postgres
    DB_PORT: 5432
    DB_DBNAME: test_db
    DB_USER: postgres
    DB_PASSWORD: postgres
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
  needs:
    - build:user-service
  script:
    - cd "User Management Microservice"
