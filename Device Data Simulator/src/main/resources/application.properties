spring.application.name=Device Data Simulator

# RabbitMQ connection  #rabitmq
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Exchange / queue / routing key
simulator.exchange=device.data.exchange
simulator.queue=device.data.queue
simulator.routing-key=device.data

# Simulator parameters
# simulator.device-id=11111111-1111-1111-1111-111111111111
simulator.device-id=6a60354a-6cfc-4521-9c4f-87cee93a6bf8
# e.g. 6 * 10min = 1h
simulator.readings-count=6
# logical interval between readings
simulator.interval-minutes=10
# or Europe/Bucharest etc.
simulator.timezone=UTC