services:
  # Frontend (React Vite build served by Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ems-frontend
    ports:
      - "3000:80"           # Frontend accessible on localhost:3000
    networks:
      - microservices-network
    depends_on:
      - traefik
    restart: unless-stopped

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.6
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"         # API Gateway
      - "8081:8080"     # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - microservices-network
    labels:
      - "traefik.enable=true"
      # Define a reusable CORS middleware for API calls from http://localhost:3000
      - "traefik.http.middlewares.api-cors.headers.accesscontrolalloworiginlist=http://localhost:3000"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolmaxage=3600"

  # Auth Service
  auth-service:
    build: ./Auth Microservice
    container_name: auth-service
    environment:
      - DB_IP=auth-db
      - DB_PORT=5432
      - DB_DBNAME=auth_microservice_db
      - DB_USER=postgres
      - DB_PASSWORD=cox
      - JWT_SECRET=d9cf114c-d9ae-4620-a62e-b5872bd61385
      - JWT_EXPIRATION=900000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-service.rule=Host(`localhost`) && PathPrefix(`/auth`)"
      - "traefik.http.services.auth-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.auth-service.entrypoints=web"
      - "traefik.http.routers.auth-service.middlewares=api-cors"
    networks:
      - microservices-network
    depends_on:
      - auth-db
    restart: on-failure

  # Auth Database
  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cox
      POSTGRES_DB: auth_microservice_db
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Management Service
  user-service:
    build: ./User Management Microservice
    container_name: user-service
    environment:
      - DB_IP=user-db
      - DB_PORT=5432
      - DB_DBNAME=user_management_microservice_db
      - DB_USER=postgres
      - DB_PASSWORD=cox
      - JWT_SECRET=d9cf114c-d9ae-4620-a62e-b5872bd61385
      - JWT_EXPIRATION=900000
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-service.rule=Host(`localhost`) && PathPrefix(`/users`)"
      - "traefik.http.services.user-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.user-service.entrypoints=web"
      - "traefik.http.routers.user-service.middlewares=api-cors"
    networks:
      - microservices-network
    depends_on:
      - user-db
    restart: on-failure

  # User Database
  user-db:
    image: postgres:16
    container_name: user-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cox
      POSTGRES_DB: user_management_microservice_db
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Device Management Service
  device-service:
    build: ./Device Management Microservice
    container_name: device-service
    environment:
      - DB_IP=device-db
      - DB_PORT=5432
      - DB_DBNAME=device_management_microservice_db
      - DB_USER=postgres
      - DB_PASSWORD=cox
      - JWT_SECRET=d9cf114c-d9ae-4620-a62e-b5872bd61385
      - JWT_EXPIRATION=900000
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.device-service.rule=Host(`localhost`) && PathPrefix(`/devices`)"
      - "traefik.http.services.device-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.device-service.entrypoints=web"
      - "traefik.http.routers.device-service.middlewares=api-cors"
    networks:
      - microservices-network
    depends_on:
      - device-db
    restart: on-failure

  # Device Database
  device-db:
    image: postgres:16
    container_name: device-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cox
      POSTGRES_DB: device_management_microservice_db
    volumes:
      - device-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservices-network
    restart: unless-stopped

  monitoring-db:
    image: postgres:16
    container_name: monitoring-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cox
      POSTGRES_DB: monitoring_microservice_db
    volumes:
      - monitoring-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  monitoring-service:
    build: ./Monitoring Microservice
    container_name: monitoring-service
    environment:
      - DB_IP=monitoring-db
      - DB_PORT=5432
      - DB_DBNAME=monitoring_microservice_db
      - DB_USER=postgres
      - DB_PASSWORD=cox
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      - monitoring-db
      - rabbitmq
    networks:
      - microservices-network
    restart: unless-stopped
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.monitoring-service.rule=Host(`localhost`) && PathPrefix(`/monitoring`)"
    - "traefik.http.services.monitoring-service.loadbalancer.server.port=8080"
    - "traefik.http.routers.monitoring-service.entrypoints=web"
    - "traefik.http.routers.monitoring-service.middlewares=api-cors"

  device-data-simulator:
    build: ./Device Data Simulator
    container_name: device-data-simulator
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - microservices-network
    restart: "no"  # run once, then exit

volumes:
  user-db-data:
  device-db-data:
  auth-db-data:
  monitoring-db-data:

networks:
  microservices-network:
    driver: bridge
